apiVersion: v1
kind: Namespace
metadata:
  name: x1
  labels:
    app.kubernetes.io/part-of: x1
---
apiVersion: v1
kind: Secret
metadata:
  name: x1-secret
  namespace: x1
type: Opaque
stringData:
  mysql-root-password: "root@123456"
  mysql-user: "iot_user"
  mysql-password: "J0ck@2023"
  minio-user: "tQH3YxLEhMeBvM0lrYvz"
  minio-password: "zp8vmX6XmNrcJlgagh8NNxLU0EojDZnzaDe75cWX"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: x1-mysql-cnf
  namespace: x1
data:
  custom.cnf: |
    [mysqld]
    skip-name-resolve
    lower_case_table_names=1
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
    max_connections=300
    max_allowed_packet=256M
    innodb_buffer_pool_size=256M
    sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    default-time-zone='+8:00'
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: x1
spec:
  selector: { app: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: x1
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql, tier: middleware }
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-worker-1
      containers:
      - name: mysql
        image: mysql:8.0
        args:
        - --lower_case_table_names=1
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_0900_ai_ci
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: x1-secret, key: mysql-root-password } }
        - name: MYSQL_DATABASE
          value: x1
        - name: MYSQL_USER
          valueFrom: { secretKeyRef: { name: x1-secret, key: mysql-user } }
        - name: MYSQL_PASSWORD
          valueFrom: { secretKeyRef: { name: x1-secret, key: mysql-password } }
        ports: [{ containerPort: 3306 }]
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits: { memory: 640Mi }
        volumeMounts:
        - { name: data, mountPath: /var/lib/mysql }
        - { name: conf, mountPath: /etc/mysql/conf.d }
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot@123456"]
          initialDelaySeconds: 25
          periodSeconds: 10
      volumes:
      - name: data
        hostPath: { path: /data/x1/mysql, type: DirectoryOrCreate }
      - name: conf
        configMap: { name: x1-mysql-cnf }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: x1
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: x1
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: middleware }
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-worker-2
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["redis-server", "--appendonly", "yes"]
        ports: [{ containerPort: 6379 }]
        resources:
          requests: { cpu: 30m, memory: 64Mi }
          limits: { memory: 128Mi }
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        hostPath: { path: /data/x1/redis, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: x1
spec:
  type: NodePort
  selector: { app: minio }
  ports:
  - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
  - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: x1
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio, tier: middleware }
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-worker-2
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-04-18T19-09-19Z
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          valueFrom: { secretKeyRef: { name: x1-secret, key: minio-user } }
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: x1-secret, key: minio-password } }
        ports:
        - { containerPort: 9000 }
        - { containerPort: 9001 }
        resources:
          requests: { cpu: 30m, memory: 128Mi }
          limits: { memory: 256Mi }
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        hostPath: { path: /data/x1/minio, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: x1
spec:
  type: NodePort
  selector: { app: emqx }
  ports:
  - { name: mqtt, port: 1883, targetPort: 1883, nodePort: 31883 }
  - { name: http-api, port: 8081, targetPort: 8081, nodePort: 30801 }
  - { name: dashboard, port: 18083, targetPort: 18083, nodePort: 31884 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: x1
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: emqx }
  template:
    metadata:
      labels: { app: emqx, tier: middleware }
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-worker-1
      containers:
      - name: emqx
        image: emqx/emqx:4.4.19
        env:
        - name: EMQX_NAME
          value: emqx
        - name: EMQX_CLUSTER__DISCOVERY
          value: static
        - name: EMQX_DASHBOARD__DEFAULT_USER__USERNAME
          value: admin
        - name: EMQX_DASHBOARD__DEFAULT_USER__PASSWORD
          value: admin123
        - name: EMQX_ALLOW_ANONYMOUS
          value: "true"
        - name: TZ
          value: Asia/Shanghai
        ports:
        - { containerPort: 1883 }
        - { containerPort: 8081 }
        - { containerPort: 18083 }
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 512Mi }
        volumeMounts:
        - { name: data, mountPath: /opt/emqx/data }
      volumes:
      - name: data
        hostPath: { path: /data/x1/emqx, type: DirectoryOrCreate }
