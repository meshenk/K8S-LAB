apiVersion: v1
kind: ConfigMap
metadata:
  name: x1-app-env
  namespace: x1
data:
  SPRING_PROFILES_ACTIVE: docker
  HOST_IP: "172.26.217.44"
  MYSQL_DS1_IP: mysql
  HOST_AI_IP: "172.26.217.44"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -Xss1m -XX:+UseContainerSupport"
---
apiVersion: v1
kind: Service
metadata:
  name: x1-admin-api
  namespace: x1
spec:
  type: NodePort
  selector: { app: x1-admin-api }
  ports:
  - { name: http, port: 9092, targetPort: 9092, nodePort: 30092 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x1-admin-api
  namespace: x1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: x1-admin-api }
  template:
    metadata:
      labels: { app: x1-admin-api, tier: app }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector: { matchLabels: { app: x1-admin-api } }
              topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: eclipse-temurin:8-jre
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - >
          java $JAVA_TOOL_OPTIONS -Djava.security.egd=file:/dev/./urandom
          -jar /app/app.jar
          --spring.profiles.active=docker
          --host_ip=$(HOST_IP)
          --mysql_ds1_ip=$(MYSQL_DS1_IP)
          --host_ai_ip=$(HOST_AI_IP)
          --jack.mqtt.host=tcp://emqx:1883
          --jack.mqtt.publishUrl=http://emqx:8081/api/v4/mqtt/publish
          --minio.endpoint=http://minio:9000
          --spring.shardingsphere.datasource.ds0.initial-size=5
          --spring.shardingsphere.datasource.ds0.min-idle=5
          --spring.shardingsphere.datasource.ds0.max-active=30
          --spring.shardingsphere.datasource.ds1.initial-size=5
          --spring.shardingsphere.datasource.ds1.min-idle=5
          --spring.shardingsphere.datasource.ds1.max-active=30
        envFrom:
        - configMapRef: { name: x1-app-env }
        ports: [{ containerPort: 9092 }]
        resources:
          requests: { cpu: 80m, memory: 320Mi }
          limits: { memory: 768Mi }
        readinessProbe:
          tcpSocket: { port: 9092 }
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 18
        volumeMounts:
        - { name: jar, mountPath: /app/app.jar, subPath: x1-admin-api.jar }
        - { name: fonts, mountPath: /opt/fonts }
      volumes:
      - name: jar
        hostPath: { path: /data/x1/jars, type: Directory }
      - name: fonts
        hostPath: { path: /data/x1/fonts, type: Directory }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x1-admin-api
  namespace: x1
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: x1-admin-api }
---
