apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      access: proxy
      url: http://prometheus.observability.svc.cluster.local:9090
      isDefault: true
      editable: false
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      editable: false
      jsonData:
        maxLines: 1000
    - name: Elasticsearch
      type: elasticsearch
      uid: elasticsearch
      access: proxy
      url: http://elasticsearch.observability.svc.cluster.local:9200
      editable: false
      jsonData:
        index: filebeat-*
        timeField: "@timestamp"
        maxConcurrentShardRequests: 5
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: k8s-lab
      orgId: 1
      folder: K8S-LAB
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  cluster-x1.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [{"color":"green","value":null},{"color":"yellow","value":0.7},{"color":"red","value":0.85}] } }, "overrides": [] },
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "auto" },
          "title": "节点 CPU",
          "type": "gauge",
          "targets": [{ "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [{"color":"green","value":null},{"color":"yellow","value":0.7},{"color":"red","value":0.85}] } }, "overrides": [] },
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "auto" },
          "title": "节点内存",
          "type": "gauge",
          "targets": [{ "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "title": "X1 可用副本",
          "type": "stat",
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"x1\"}", "legendFormat": "{{deployment}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "id": 4,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last"] } },
          "title": "节点内存用量",
          "type": "timeseries",
          "targets": [{ "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "id": 5,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last"] } },
          "title": "X1 容器重启次数",
          "type": "timeseries",
          "targets": [{ "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"x1\"})", "legendFormat": "{{pod}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "id": 6,
          "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["last"] } },
          "title": "X1 与观测容器工作集内存",
          "type": "timeseries",
          "targets": [{ "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"x1|observability\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 21 },
          "id": 7,
          "options": { "dedupStrategy": "none", "enableLogDetails": true, "showTime": true, "wrapLogMessage": false },
          "title": "X1 最近日志（Loki）",
          "type": "logs",
          "targets": [{ "expr": "{namespace=\"x1\"}", "refId": "A" }]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["k8s-lab", "x1"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Cluster & X1",
      "uid": "k8s-lab-cluster-x1"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 32000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-server
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: grafana
        image: docker.m.daocloud.io/grafana/grafana:11.2.2
        env:
        - { name: GF_SECURITY_ADMIN_USER, value: admin }
        - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
        - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
        - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
        - { name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning }
        - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
        ports:
        - containerPort: 3000
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 192Mi }
        readinessProbe:
          httpGet: { path: /api/health, port: 3000 }
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
        - { name: dashboards-prov, mountPath: /etc/grafana/provisioning/dashboards }
        - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
      - name: datasources
        configMap:
          name: grafana-provisioning
          items:
          - { key: datasources.yaml, path: datasources.yaml }
      - name: dashboards-prov
        configMap:
          name: grafana-provisioning
          items:
          - { key: dashboards.yaml, path: dashboards.yaml }
      - name: dashboards
        configMap:
          name: grafana-dashboards
