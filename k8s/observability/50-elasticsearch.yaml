apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: observability
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
    nodePort: 32200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: observability
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-server
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: fix-perms
        image: docker.m.daocloud.io/library/busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
        volumeMounts:
        - { name: data, mountPath: /usr/share/elasticsearch/data }
      containers:
      - name: elasticsearch
        image: docker.m.daocloud.io/library/elasticsearch:7.17.21
        env:
        - { name: discovery.type, value: single-node }
        - { name: cluster.name, value: k8s-lab }
        - { name: ES_JAVA_OPTS, value: "-Xms256m -Xmx256m" }
        - { name: xpack.security.enabled, value: "false" }
        - { name: xpack.ml.enabled, value: "false" }
        - { name: bootstrap.memory_lock, value: "false" }
        - { name: cluster.routing.allocation.disk.threshold_enabled, value: "false" }
        ports:
        - containerPort: 9200
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 640Mi }
        readinessProbe:
          httpGet: { path: /_cluster/health, port: 9200 }
          initialDelaySeconds: 40
          periodSeconds: 15
          failureThreshold: 20
        volumeMounts:
        - { name: data, mountPath: /usr/share/elasticsearch/data }
      volumes:
      - name: data
        hostPath: { path: /data/obs/elasticsearch, type: DirectoryOrCreate }
