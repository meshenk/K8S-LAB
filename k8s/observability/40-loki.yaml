apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: 2020-10-24
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: false
      volume_enabled: true
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      nodeSelector:
        kubernetes.io/hostname: rke2-server
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: loki
        image: docker.m.daocloud.io/grafana/loki:3.1.1
        args: ["-config.file=/etc/loki/loki.yaml"]
        ports:
        - containerPort: 3100
        resources:
          requests: { cpu: 20m, memory: 128Mi }
          limits: { memory: 256Mi }
        readinessProbe:
          httpGet: { path: /ready, port: 3100 }
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - { name: config, mountPath: /etc/loki }
        - { name: data, mountPath: /loki }
      volumes:
      - name: config
        configMap: { name: loki-config }
      - name: data
        hostPath: { path: /data/obs/loki, type: DirectoryOrCreate }
