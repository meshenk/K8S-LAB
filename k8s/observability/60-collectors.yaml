apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
    - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
    - job_name: kubernetes-pods
      static_configs:
      - targets: [localhost]
        labels:
          job: kubernetes-pods
          node: ${NODE_NAME}
          __path__: /var/log/containers/*.log
      pipeline_stages:
      - cri: {}
      - regex:
          source: filename
          expression: '/var/log/containers/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-[a-f0-9]{64}\\.log'
      - labels:
          namespace:
          pod:
          container:
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: observability
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
      - /var/log/containers/*.log
      processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"
    output.elasticsearch:
      hosts: ["http://elasticsearch.observability.svc.cluster.local:9200"]
      index: "filebeat-%{+yyyy.MM.dd}"
    setup.ilm.enabled: false
    setup.template.enabled: true
    setup.template.name: "filebeat"
    setup.template.pattern: "filebeat-*"
    setup.template.settings:
      index.number_of_shards: 1
      index.number_of_replicas: 0
    setup.template.overwrite: false
    logging.level: warning
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: observability
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: promtail
        image: docker.m.daocloud.io/grafana/promtail:3.1.1
        args:
        - -config.file=/etc/promtail/config.yml
        - -config.expand-env=true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: { fieldPath: spec.nodeName }
        resources:
          requests: { cpu: 15m, memory: 32Mi }
          limits: { memory: 80Mi }
        volumeMounts:
        - { name: config, mountPath: /etc/promtail }
        - { name: varlog, mountPath: /var/log, readOnly: true }
        - { name: run, mountPath: /run/promtail }
      volumes:
      - name: config
        configMap: { name: promtail-config }
      - name: varlog
        hostPath: { path: /var/log }
      - name: run
        emptyDir: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: observability
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: observability
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: filebeat
        image: docker.m.daocloud.io/elastic/filebeat:7.17.21
        args: ["-c", "/etc/filebeat.yml", "-e"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: { fieldPath: spec.nodeName }
        resources:
          requests: { cpu: 20m, memory: 48Mi }
          limits: { memory: 128Mi }
        volumeMounts:
        - { name: config, mountPath: /etc/filebeat.yml, subPath: filebeat.yml }
        - { name: varlog, mountPath: /var/log, readOnly: true }
        - { name: data, mountPath: /usr/share/filebeat/data }
      volumes:
      - name: config
        configMap: { name: filebeat-config }
      - name: varlog
        hostPath: { path: /var/log }
      - name: data
        hostPath: { path: /data/obs/filebeat, type: DirectoryOrCreate }
